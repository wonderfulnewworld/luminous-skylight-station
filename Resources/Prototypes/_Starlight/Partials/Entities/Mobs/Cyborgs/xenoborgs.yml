- type: !PartialOnly 'entity'
  id: XenoborgEngi
  suffix: Empty Chassis
  components:
  - type: BorgTransponder
    sprite:
      sprite: Mobs/Silicon/Chassis/xeno_engi.rsi
      state: borg
  - type: Sprite
    sprite: Mobs/Silicon/Chassis/xeno_engi.rsi
    layers:
    - !CombineIndex:0 state: borg
    - !CombineIndex:1 state: borg_e
    - !CombineIndex:2 state: borg_l
  - type: BorgChassis
    maxModules: 8
    hasMindState: borg_e
    noMindState: borg_e_r
  - type: ContainerFill
    containers:
      borg_brain: !Remove ''
      borg_module:
      - !Index:3 'XenoborgModuleRCD'
      - !Remove 'BorgModuleRCD'
  - type: ItemSlots
    slots:
      cell_slot:
        blacklist:
          tags:
          - MechReactor
  - type: ShowHealthBars
    damageContainers:
    - IPC
    - Hybrid
    - MoffDemonInorganic

- type: !PartialOnly 'entity'
  id: XenoborgHeavy
  suffix: Empty Chassis
  components:
  - type: BorgTransponder
    sprite:
      sprite: Mobs/Silicon/Chassis/xeno_heavy.rsi
      state: borg
  - type: Sprite
    sprite: Mobs/Silicon/Chassis/xeno_heavy.rsi
    layers:
    - !CombineIndex:0 state: borg
    - !CombineIndex:1 state: borg_e
    - !CombineIndex:2 state: borg_l
  - type: BorgChassis
    hasMindState: borg_e
    noMindState: borg_e_r
  - type: MobThresholds
    thresholds:
      250: !Remove ''
      750: !Remove ''
      150: Critical
      400: Dead
  - type: Destructible
    thresholds:
    - !CombineIndex:0 trigger:
        damage: 112
    - !CombineIndex:1 trigger:
        damage: 400
  - type: ContainerFill
    containers:
      borg_brain: !Remove ''
  - type: ItemSlots
    slots:
      cell_slot:
        blacklist:
          tags:
          - MechReactor

