- type: !PartialOnly 'entity'
  id: BaseBorgChassisNotIonStormable
  parent:
  - !Index:2 'BaseSiliconLanguages'
  components:
  - type: TextToSpeech
  - type: Sprite
    sprite: Mobs/Silicon/Chassis/generic.rsi
  - type: MobThresholds
    thresholds:
      100: !Remove ''
      300: !Remove ''
      75: Critical
      225: Dead
  - type: ArmorSparkEffect
    alwaysSparks: true
  - type: HandlessDoAfter
  - type: CanCrawlWithoutHands
  - type: BorgModuleCrawlModifier
  - type: ItemSlots
    slots:
      cell_slot:
        blacklist:
          tags:
          - MechReactor
  - type: Speech
    allowedEmotes:
    - Beep
    - Ping
    - Buzz
    - Buzz-Two
    - Chime
    - Honk
  - type: Damageable
    damageModifierSet: CivilianSilicon
  - type: Destructible
    thresholds:
    - !Index:1
      trigger: !type:DamageTrigger
        damage: 225
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers:
        - borg_brain
        - borg_module
        - cell_slot
      - !type:DoActsBehavior
        acts:
        - Destruction
    - !Index:0
      trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - !Remove
      trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers:
        - borg_brain
        - borg_module
        - cell_slot
      - !type:DoActsBehavior
        acts:
        - Destruction
    - !Remove
      trigger: !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
  - type: PointLight
    mask: !Remove ''
    lightMask: ConeSingle
  - type: Tag
    tags:
    - !Index:5 'SiliconEmotesFH'
  - type: CyborgSparkEffect
  - type: StationAIShunt
  - type: BorgSwitchableSubtype
  - type: Crawler
  - type: BatteryAlert
  - type: Blindable
  - type: EyeProtection
  - type: Stripping
  - type: InteractionPopup
    interactSuccessString: petting-success-generic-cyborg
    interactFailureString: petting-failure-generic-cyborg
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: GlitchOnEMP

- type: !PartialOnly 'entity'
  id: BaseXenoborgChassis
  parent:
  - BaseXenoSiliconLanguages
  - BaseBorgChassisNotIonStormable
  components:
  - type: Sprite
    sprite: Mobs/Silicon/Chassis/generic.rsi
  - type: Damageable
    damageModifierSet: ArmoredSilicon
  - type: MobThresholds
    thresholds:
      125: !Remove ''
      375: !Remove ''
      100: Critical
      300: Dead
  - type: IntrinsicRadioTransmitter
    channels:
    - !Remove 'Binary'
  - type: BorgChassis
    jobIconOverride: JobIconXenoborg
    jobTitleOverride: chat-radio-xenoborg
  - type: Destructible
    thresholds:
    - !Index:1
      trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          PinpointerMothershipPiece:
            min: 1
            max: 1
      - !type:EmptyContainersBehaviour
        containers:
        - borg_brain
        - borg_module
        - cell_slot
      - !type:DoActsBehavior
        acts:
        - Destruction
    - !Index:0
      trigger: !type:DamageTrigger
        damage: 65
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer_xenoborg.ogg
          params:
            volume: 5
    - !Remove
      trigger: !type:DamageTrigger
        damage: 375
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          PinpointerMothershipPiece:
            min: 1
            max: 1
      - !type:EmptyContainersBehaviour
        containers:
        - borg_brain
        - borg_module
        - cell_slot
      - !type:DoActsBehavior
        acts:
        - Destruction
    - !Remove
      trigger: !type:DamageTrigger
        damage: 90
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer_xenoborg.ogg
          params:
            volume: 5
