- type: !PartialOnly 'entity'
  id: BaseBorgChassisNotIonStormable
  components:
  - type: TextToSpeech
  - type: Sprite
    sprite: Mobs/Silicon/Chassis/generic.rsi
  - type: MobThresholds
    thresholds:
      100: !Remove ''
      300: !Remove ''
      75: Critical
      225: Dead
  - type: ArmorSparkEffect
    alwaysSparks: true
  - type: HandlessDoAfter
  - type: CanCrawlWithoutHands
  - type: BorgModuleCrawlModifier
  - type: ItemSlots
    slots:
      cell_slot:
        blacklist:
          tags:
          - MechReactor
  - type: Speech
    allowedEmotes:
    - Beep
    - Ping
    - Buzz
    - Buzz-Two
    - Chime
    - Honk
  - type: Damageable
    damageModifierSet: CivilianSilicon
  - type: Destructible
    thresholds:
    - !CombineIndex:0 trigger:
        damage: 50
    - !CombineIndex:1 trigger:
        damage: 225
  - type: PointLight
    mask: !Remove ''
    lightMask: ConeSingle
  - type: Tag
    tags:
    - !Index:5 'SiliconEmotesFH'
  - type: CyborgSparkEffect
  - type: StationAIShunt
  - type: BorgSwitchableSubtype
  - type: Crawler
  - type: BatteryAlert
  - type: Blindable
  - type: EyeProtection
  - type: Stripping
  - type: InteractionPopup
    interactSuccessString: petting-success-generic-cyborg
    interactFailureString: petting-failure-generic-cyborg
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: GlitchOnEMP

- type: !PartialOnly 'entity'
  id: BaseXenoborgChassis
  components:
  - type: Sprite
    sprite: Mobs/Silicon/Chassis/generic.rsi
  - type: Damageable
    damageModifierSet: ArmoredSilicon
  - type: MobThresholds
    thresholds:
      125: !Remove ''
      375: !Remove ''
      100: Critical
      300: Dead
  - type: IntrinsicRadioTransmitter
    channels:
    - !Remove 'Binary'
  - type: BorgChassis
    jobIconOverride: JobIconXenoborg
    jobTitleOverride: chat-radio-xenoborg
  - type: Destructible
    thresholds:
    - !CombineIndex:0 trigger:
        damage: 65
    - !CombineIndex:1 trigger:
        damage: 300
