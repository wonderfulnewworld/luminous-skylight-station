- type: !PartialOnly 'entity'
  id: MothershipCore
  parent:
  - !Index:2 'BaseXenoSiliconLanguages'
  components:
  - type: Destructible
    thresholds:
    - !Index:0
      trigger: !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ExplodeBehavior ''
      - !type:SpawnEntitiesBehavior
        spawn:
          MachineFrameDestroyed:
            min: 1
            max: 1
      - !type:SpawnGasBehavior
        gasMixture:
          volume: 1000
          moles:
            CarbonDioxide: 340.5701689
          temperature: 373.15
    - !Remove
      trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ExplodeBehavior ''
      - !type:SpawnEntitiesBehavior
        spawn:
          MachineFrameDestroyed:
            min: 1
            max: 1
      - !type:SpawnGasBehavior
        gasMixture:
          volume: 1000
          moles:
            CarbonDioxide: 340.5701689
          temperature: 373.15
  - type: RoboticsConsole
    allowBorgControl: true
    radioChannel: Mothership
  - type: DeviceNetwork
    transmitFrequencyId: Xenoborg
  - type: WarpPoint
    blacklist:
      tags:
      - GhostOnlyWarp
  - type: Tag
    tags:
    - !Index:3 'GhostOnlyWarp'
  - type: BorgChassis
    jobIconOverride: JobIconXenoborgMothership
    jobTitleOverride: chat-radio-mothership
  - type: ItemSlots
    slots:
      cell_slot:
        blacklist:
          tags:
          - MechReactor
