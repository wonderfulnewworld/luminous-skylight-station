- type: !PartialOnly 'entity'
  id: MothershipCore
  components:
  - type: Destructible
    thresholds:
    - !CombineIndex:0 trigger:
        damage: 400
  - type: RoboticsConsole
    allowBorgControl: true
    radioChannel: Mothership
  - type: DeviceNetwork
    transmitFrequencyId: Xenoborg
  - type: WarpPoint
    blacklist:
      tags:
      - GhostOnlyWarp
  - type: Tag
    tags:
    - !Index:3 'GhostOnlyWarp'
  - type: BorgChassis
    jobIconOverride: JobIconXenoborgMothership
    jobTitleOverride: chat-radio-mothership
  - type: ItemSlots
    slots:
      cell_slot:
        blacklist:
          tags:
          - MechReactor
