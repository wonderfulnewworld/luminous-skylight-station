- type: !PartialOnly 'entity'
  id: BaseWelder
  components:
  - type: ComponentToggler
    components:
    - !CombineIndex:0 'malus': !Remove ''
      type: IgniteOnMeleeHit
    - !CombineIndex:1 'type': DisarmMalus
      malus: 0.6
  - type: Tool
    qualities:
    - Welding
  - type: ToolTileCompatible
  - type: ESSparkOnItemToggle
    count: 1
    sparkPrototype: MoffEffectSparksSilent
  - type: Tag
    tags:
    - ThermiteIgnitor
  - type: SurgeryTool
  - type: Cautery
    successRate: 0.75
    startSound:
      path: /Audio/_Starlight/Medical/Surgery/cautery1.ogg
    endSound:
      path: /Audio/_Starlight/Medical/Surgery/cautery2.ogg
  - type: WelderSurgery
    startSound: /Audio/Items/welder.ogg
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Starlight/Items/Handling/weldingtool_pickup.ogg

