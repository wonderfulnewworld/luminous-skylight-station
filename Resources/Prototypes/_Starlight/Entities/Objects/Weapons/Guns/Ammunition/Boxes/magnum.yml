- type: entity
  parent: BaseMagazineBoxMagnum
  id: MagazineBoxMagnumRubber
  name: ammunition box (.45 magnum rubber)
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumRubber
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: rubber

- type: entity
  parent: BaseMagazineBoxMagnum
  id: MagazineBoxMagnumFMJ
  name: ammunition box (.45 magnum FMJ)
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumFMJ
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: fmj

- type: entity
  id: MagazineBoxMagnumDragon
  parent: MagazineBoxMagnumIncendiary
  name: ammunition box (.45 magnum dragon)
  description: A cardboard box of .45 magnum rounds. Intended to hold volatile Dragon ammunition that sets targets ablaze.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumDragon
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]
    - state: incendiary
