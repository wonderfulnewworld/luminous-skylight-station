- type: entity
  id: MagazineBoxRifleDragon
  parent: MagazineBoxRifleIncendiary
  name: ammunition box (.20 rifle dragon)
  description: A cardboard box of .20 rifle rounds. Intended to hold volatile Dragon ammunition that sets targets ablaze.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeRifleDragon
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]
    - state: incendiary

