- type: entity
  parent: BaseMagazineBoxLightRifle
  id: MagazineBoxLightRifleRubber
  name: ammunition box (.30 rifle rubber)
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifleRubber
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: rubber

- type: entity
  id: MagazineBoxLightRifleDragon
  parent: MagazineBoxLightRifleIncendiary
  name: ammunition box (.30 rifle dragon)
  description: A cardboard box of .30 rifle rounds. Intended to hold volatile Dragon ammunition that sets targets ablaze.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifleDragon
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]
    - state: incendiary
