- type: entity
  parent: BaseVinylDisc
  id: BaseEvilVinylDisc
  name: evil vinyl disc
  abstract: true
  components:
  - type: Sprite
    state: default
    layers:
    - state: base-dark
    - state: base-shine
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          VinylBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: MeleeWeapon
    attackRate: 2
    damage:
      types:
        Slash: 8
  - type: DamageOtherOnHit
    ignoreResistances: true
    damage:
      types:
        Slash: 10

# War Ops
- type: entity
  parent: [BaseEvilVinylDisc, BaseSyndicateContraband]
  id: VinylWarInevitable
  name: "vinyl: War Inevitable"
  description: A dramatic song that preludes inevitable conflict. Published by Comitas Systems during the Pod Wars.
  components:
  - type: Sprite
    state: default
    layers:
    - state: base-dark
    - state: label
      color: "#940000"
    - state: base-shine
  - type: Vinyl
    song:
      path: /Audio/_Starlight/StationEvents/War_Inevitable.ogg

